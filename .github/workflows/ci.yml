# main에 push하면 1) 테스트 2) 통과하면 Lightsail에 자동 배포
# 필요한 시크릿: LIGHTSAIL_HOST, LIGHTSAIL_USERNAME, LIGHTSAIL_SSH_KEY
name: CI-CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 의존성 설치와 테스트
        run: |
          pip install uv
          uv sync
          uv run python -m pytest tests -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Lightsail 서버에 접속해서 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            set -e
            cd ~/review-api
            git pull origin main
            docker build -t review-api .
            docker rm -f review || true
            docker run -d --name review --restart unless-stopped \
              -p 8005:8005 --env-file .env review-api
            sleep 5
            docker ps
            curl -fsS http://localhost:8005/docs -o /dev/null && echo "서버 정상 응답"